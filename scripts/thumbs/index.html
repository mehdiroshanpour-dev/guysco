<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const S = 192;
const chars = await (await fetch('/characters.json')).json();
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(S, S); renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const kayAnims = (await loader.loadAsync('/models/animations/Rig_Medium_General.glb')).animations;
const out = {};
for (const c of chars) {
  const scene = new THREE.Scene();

  const d = new THREE.DirectionalLight(0xffe2b8, 2.2); d.position.set(1.5, 3, 4); scene.add(d);
  const g = await loader.loadAsync(c.model);
  const obj = g.scene; scene.add(obj);
  const clips = g.animations.length ? g.animations : kayAnims;
  const idle = clips.find(a => /^idle/i.test(a.name)) || clips.find(a => /idle/i.test(a.name)) || clips[0];
  if (idle) { const m = new THREE.AnimationMixer(obj); m.clipAction(idle).play(); m.update(0.4); }

  const focusY = box.max.y - size.y * 0.32, span = Math.max(size.y * 0.62, size.x * 0.8);
  const cam = new THREE.PerspectiveCamera(28, 1, 0.01, 1000);

}
window.__thumbs = out;
</script></body></html>
